[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pushnow"
version = "0.1.1"
description = "Python bindings for PushNow v2 encrypted notifications with an explicit Node.js crypto runtime"
requires-python = ">=3.10"
dependencies = []
readme = "README.md"
keywords = ["pushnow", "notifications", "e2ee", "hpke", "sdk", "automation", "ai-agents"]

[project.urls]
Homepage = "https://github.com/pushnow-dev/pushnow-python"
Issues = "https://github.com/pushnow-dev/pushnow-python/issues"
Source = "https://github.com/pushnow-dev/pushnow-python"

[tool.setuptools]
packages = ["pushnow", "pushnow.runtime"]

[tool.setuptools.package-data]
pushnow = ["runtime/*.js", "runtime/package.json", "runtime/package-lock.json"]
